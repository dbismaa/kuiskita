<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuisKita – Host</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
:root{
  --c1:#FF4D6D;--c2:#4CC9F0;--c3:#FFD93D;--c4:#06D6A0;--c5:#A855F7;
  --dark:#0A0A1A;--card:#13132A;--border:#252545;
  --text:#F5F5FF;--muted:#7070AA;--radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,.logo-text{font-family:'Fredoka One',cursive}

/* BG STARS */
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(168,85,247,0.08) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(76,201,240,0.08) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}

.screen{display:none;min-height:100vh;padding:2rem;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}

/* FLOATING PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:0.6}
  90%{opacity:0.3}
  100%{transform:translateY(-10vh) scale(1.2);opacity:0}
}

/* ── SETUP ── */
#screen-setup{gap:2rem}
.logo-wrap{text-align:center;animation:bounceIn 0.8s cubic-bezier(0.34,1.56,0.64,1)}
.logo-text{
  font-size:4rem;
  background:linear-gradient(135deg,var(--c1),var(--c3),var(--c2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,77,109,0.4));
  letter-spacing:2px;
}
.logo-sub{color:var(--muted);font-size:1rem;font-weight:600;margin-top:-0.5rem}
.logo-emojis{font-size:2rem;animation:wiggle 2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes bounceIn{from{transform:scale(0.5) translateY(-50px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

.setup-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:2rem;
  width:100%;max-width:500px;
  animation:slideUp 0.6s ease 0.3s both;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}

.form-label{font-size:0.85rem;color:var(--muted);font-weight:700;margin-bottom:0.4rem;display:block;text-transform:uppercase;letter-spacing:1px}

.pin-big-input{
  width:100%;
  background:var(--dark);
  border:2px solid var(--border);
  border-radius:16px;
  color:var(--text);
  font-family:'Fredoka One',cursive;
  font-size:3rem;
  padding:1rem;
  text-align:center;
  letter-spacing:12px;
  outline:none;
  transition:border-color 0.3s,box-shadow 0.3s;
}
.pin-big-input:focus{border-color:var(--c3);box-shadow:0 0 0 4px rgba(255,217,61,0.2)}

.time-row{display:flex;gap:0.75rem;margin-top:1rem}
.time-btn{
  flex:1;padding:0.75rem;border-radius:12px;
  background:var(--dark);border:2px solid var(--border);
  color:var(--muted);font-family:'Fredoka One',cursive;font-size:1.1rem;
  cursor:pointer;transition:all 0.2s;
}
.time-btn:hover,.time-btn.active{border-color:var(--c2);color:var(--c2);background:rgba(76,201,240,0.1)}

.btn-launch{
  width:100%;padding:1.1rem;margin-top:1.5rem;
  background:linear-gradient(135deg,var(--c1),var(--c5));
  border:none;border-radius:50px;
  font-family:'Fredoka One',cursive;font-size:1.3rem;
  color:#fff;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 8px 30px rgba(255,77,109,0.4);
}
.btn-launch:hover{transform:scale(1.03) translateY(-2px);box-shadow:0 12px 40px rgba(255,77,109,0.6)}
.btn-launch:active{transform:scale(0.97)}

.error-box{
  background:rgba(255,77,109,0.1);border:1px solid var(--c1);
  border-radius:12px;padding:0.75rem 1rem;color:var(--c1);
  font-size:0.9rem;width:100%;max-width:500px;text-align:center;
  display:none;animation:shake 0.4s ease;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ── LOBBY ── */
#screen-lobby{gap:1.5rem}
.lobby-pin-card{
  background:var(--card);border:2px solid var(--c3);
  border-radius:var(--radius);padding:2rem 3rem;text-align:center;
  box-shadow:0 0 40px rgba(255,217,61,0.15);
  animation:pulse-border 2s ease-in-out infinite;
}
@keyframes pulse-border{
  0%,100%{box-shadow:0 0 40px rgba(255,217,61,0.15)}
  50%{box-shadow:0 0 60px rgba(255,217,61,0.35)}
}
.lobby-pin-label{color:var(--muted);font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:2px}
.lobby-pin-code{
  font-family:'Fredoka One',cursive;font-size:6rem;line-height:1;
  background:linear-gradient(135deg,var(--c3),var(--c1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:12px;
  filter:drop-shadow(0 4px 20px rgba(255,217,61,0.3));
}
.lobby-pin-url{color:var(--muted);font-size:0.85rem;margin-top:0.5rem}
.lobby-pin-url strong{color:var(--c2)}

.player-counter{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--c4);text-align:center}
.player-counter span{font-size:3rem}

.player-grid{
  display:flex;flex-wrap:wrap;gap:0.6rem;justify-content:center;
  max-width:720px;max-height:250px;overflow-y:auto;padding:0.5rem;
}
.player-chip{
  background:linear-gradient(135deg,rgba(168,85,247,0.2),rgba(76,201,240,0.2));
  border:1px solid rgba(168,85,247,0.4);
  border-radius:50px;padding:0.5rem 1.2rem;
  font-size:0.95rem;font-weight:700;
  animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

.btn-start{
  padding:1rem 3rem;
  background:linear-gradient(135deg,var(--c4),var(--c2));
  border:none;border-radius:50px;
  font-family:'Fredoka One',cursive;font-size:1.4rem;color:var(--dark);
  cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 8px 30px rgba(6,214,160,0.4);
}
.btn-start:hover{transform:scale(1.05) translateY(-3px);box-shadow:0 16px 40px rgba(6,214,160,0.5)}

/* ── QUESTION ── */
#screen-question{gap:1.2rem}
.q-topbar{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:900px;
}
.q-badge{
  background:var(--card);border:1px solid var(--border);
  border-radius:50px;padding:0.5rem 1.2rem;
  font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--c2);
}

.timer-wrap{position:relative;width:90px;height:90px}
.timer-wrap svg{transform:rotate(-90deg)}
#timer-circle{transition:stroke-dashoffset 1s linear}
.timer-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:1.8rem;
}

.q-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:2.5rem 2rem;
  width:100%;max-width:900px;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  animation:slideDown 0.4s ease;
}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.q-text{font-family:'Fredoka One',cursive;font-size:1.8rem;line-height:1.3;color:var(--text)}

.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;width:100%;max-width:900px}
.ans-btn{
  padding:1.4rem 1rem;border-radius:18px;
  font-family:'Fredoka One',cursive;font-size:1.1rem;
  border:none;cursor:pointer;color:#fff;
  text-align:left;display:flex;align-items:center;gap:0.9rem;
  transition:transform 0.15s,box-shadow 0.2s;
  animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  position:relative;overflow:hidden;
}
.ans-btn:nth-child(1){animation-delay:0.05s}
.ans-btn:nth-child(2){animation-delay:0.1s}
.ans-btn:nth-child(3){animation-delay:0.15s}
.ans-btn:nth-child(4){animation-delay:0.2s}
.ans-btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background 0.2s}
.ans-btn:hover::after{background:rgba(255,255,255,0.1)}
.ans-btn:hover{transform:scale(1.03) translateY(-2px)}
.ans-btn.c1{background:linear-gradient(135deg,#FF4D6D,#FF2D50);box-shadow:0 6px 20px rgba(255,77,109,0.4)}
.ans-btn.c2{background:linear-gradient(135deg,#4CC9F0,#2AAEDD);color:var(--dark);box-shadow:0 6px 20px rgba(76,201,240,0.4)}
.ans-btn.c3{background:linear-gradient(135deg,#FFD93D,#FFC107);color:var(--dark);box-shadow:0 6px 20px rgba(255,217,61,0.4)}
.ans-btn.c4{background:linear-gradient(135deg,#06D6A0,#00B887);color:var(--dark);box-shadow:0 6px 20px rgba(6,214,160,0.4)}

.ans-icon{
  width:40px;height:40px;border-radius:10px;
  background:rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;flex-shrink:0;
}

.resp-pill{
  display:flex;align-items:center;gap:1rem;
  background:var(--card);border:1px solid var(--border);
  border-radius:50px;padding:0.7rem 1.5rem;
  width:100%;max-width:900px;
}
.resp-track{flex:1;height:8px;background:var(--border);border-radius:50px;overflow:hidden}
.resp-fill{height:100%;background:linear-gradient(90deg,var(--c4),var(--c2));border-radius:50px;transition:width 0.4s ease}
.resp-label{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--c4);white-space:nowrap}

/* ── RESULT ── */
#screen-result{gap:1.2rem}
.result-title{font-family:'Fredoka One',cursive;font-size:2.5rem;animation:bounceIn 0.5s ease}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;width:100%;max-width:900px}
.res-card{
  border-radius:16px;padding:1.1rem 1.2rem;
  display:flex;align-items:center;gap:0.9rem;
  animation:popIn 0.4s ease both;
}
.res-card.ok{background:rgba(6,214,160,0.12);border:2px solid var(--c4)}
.res-card.no{background:rgba(255,77,109,0.08);border:1px solid rgba(255,77,109,0.25);opacity:0.65}

.bar-section{width:100%;max-width:900px}
.bar-item{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.6rem}
.bar-lbl{width:60px;font-size:0.85rem;color:var(--muted);text-align:right;font-weight:700}
.bar-track2{flex:1;height:32px;background:var(--border);border-radius:8px;overflow:hidden}
.bar-fill2{
  height:100%;border-radius:8px;
  display:flex;align-items:center;padding-left:10px;
  font-family:'Fredoka One',cursive;font-size:0.95rem;
  min-width:36px;transition:width 1s cubic-bezier(0.34,1.1,0.64,1);
}
.bar-cnt{width:28px;font-size:0.85rem;color:var(--muted);font-weight:700}

.btn-next{
  padding:0.9rem 2.5rem;
  background:linear-gradient(135deg,var(--c5),var(--c2));
  border:none;border-radius:50px;
  font-family:'Fredoka One',cursive;font-size:1.2rem;color:#fff;
  cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 8px 25px rgba(168,85,247,0.4);
}
.btn-next:hover{transform:scale(1.05) translateY(-2px)}

/* ── LEADERBOARD ── */
#screen-leaderboard{gap:1.5rem}
.lb-title{font-family:'Fredoka One',cursive;font-size:3rem;text-align:center;animation:bounceIn 0.7s ease}

.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:100}
.conf{position:absolute;width:10px;height:10px;animation:confettiFall linear forwards}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:0.75rem;width:100%;max-width:600px}
.pod-item{display:flex;flex-direction:column;align-items:center;gap:0.5rem;flex:1}
.pod-avatar{
  width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:800;
  font-family:'Fredoka One',cursive;
}
.pod-name{font-size:0.9rem;font-weight:700;text-align:center;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-pts{color:var(--muted);font-size:0.75rem}
.pod-block{
  width:100%;border-radius:12px 12px 0 0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:2rem;
}
.pod-item.p1 .pod-avatar{background:rgba(255,217,61,0.2);color:var(--c3);border:2px solid var(--c3)}
.pod-item.p2 .pod-avatar{background:rgba(160,160,160,0.2);color:#CCC;border:2px solid #AAA}
.pod-item.p3 .pod-avatar{background:rgba(205,127,50,0.2);color:#CD7F32;border:2px solid #CD7F32}
.pod-item.p1 .pod-block{background:linear-gradient(180deg,var(--c3),#E8A800);color:var(--dark);height:130px}
.pod-item.p2 .pod-block{background:linear-gradient(180deg,#B0B0B0,#888);color:var(--dark);height:95px}
.pod-item.p3 .pod-block{background:linear-gradient(180deg,#CD7F32,#9B5E1F);color:var(--dark);height:70px}

.lb-list{width:100%;max-width:600px;display:flex;flex-direction:column;gap:0.5rem}
.lb-row{
  display:flex;align-items:center;gap:1rem;
  padding:0.9rem 1.2rem;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  animation:slideIn 0.4s ease both;
}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
.lb-rank{font-family:'Fredoka One',cursive;font-size:1.2rem;width:32px;color:var(--muted)}
.lb-name{flex:1;font-weight:700}
.lb-score{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--c4)}

.btn-again{
  padding:0.9rem 2rem;margin-top:0.5rem;
  background:transparent;border:2px solid var(--border);
  border-radius:50px;font-family:'Fredoka One',cursive;
  font-size:1.1rem;color:var(--text);cursor:pointer;
  transition:all 0.2s;
}
.btn-again:hover{border-color:var(--c1);color:var(--c1)}

/* LOADING DOTS */
.dots{display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c2);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:0.2s}.dot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1.2)}}

@media(max-width:600px){
  .ans-grid{grid-template-columns:1fr 1fr}
  .res-grid{grid-template-columns:1fr 1fr}
  .lobby-pin-code{font-size:4rem;letter-spacing:6px}
  .q-text{font-size:1.3rem}
  .logo-text{font-size:3rem}
}
</style>
</head>
<body>

<!-- Particles BG -->
<div class="particles" id="particles"></div>

<!-- ══════════ SETUP ══════════ -->
<div id="screen-setup" class="screen active">
  <div class="logo-wrap">
    <div class="logo-emojis">🎮</div>
    <div class="logo-text">KuisKita</div>
    <div class="logo-sub">Platform Kuis Interaktif untuk Acara & Event</div>
  </div>

  <div id="setup-error" class="error-box"></div>

  <div class="setup-card">
    <div style="margin-bottom:1.5rem">
      <label class="form-label">🔐 Buat PIN Room (4-6 digit)</label>
      <input type="text" class="pin-big-input" id="room-pin"
        maxlength="6" placeholder="••••••" inputmode="numeric"
        oninput="this.value=this.value.replace(/\D/g,'')" />
    </div>
    <div>
      <label class="form-label">⏱ Waktu per soal</label>
      <div class="time-row" id="time-row">
        <button class="time-btn" onclick="setTime(10,this)">10 dtk</button>
        <button class="time-btn active" onclick="setTime(20,this)">20 dtk</button>
        <button class="time-btn" onclick="setTime(30,this)">30 dtk</button>
        <button class="time-btn" onclick="setTime(60,this)">60 dtk</button>
      </div>
    </div>
    <button class="btn-launch" onclick="startSetup()">🚀 Buat Room & Muat Soal!</button>
  </div>
</div>

<!-- ══════════ LOBBY ══════════ -->
<div id="screen-lobby" class="screen">
  <div class="lobby-pin-card">
    <div class="lobby-pin-label">📱 Pemain buka player.html dan masukkan PIN:</div>
    <div class="lobby-pin-code" id="display-pin">------</div>
    <div class="lobby-pin-url">Buka <strong>player.html</strong> di browser HP masing-masing</div>
  </div>

  <div class="player-counter">
    <span id="player-count">0</span> pemain bergabung 🎉
  </div>

  <div class="player-grid" id="player-grid"></div>

  <button class="btn-start" onclick="startGame()">▶ Mulai Game!</button>
  <div class="dots" id="lobby-dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span style="color:var(--muted);font-size:0.9rem;margin-left:4px">Menunggu pemain...</span>
  </div>
</div>

<!-- ══════════ QUESTION ══════════ -->
<div id="screen-question" class="screen">
  <div class="q-topbar">
    <div class="q-badge">Soal <span id="q-num">1</span> / <span id="q-total">?</span></div>
    <div class="timer-wrap">
      <svg width="90" height="90" viewBox="0 0 90 90">
        <circle cx="45" cy="45" r="38" fill="none" stroke="#252545" stroke-width="9"/>
        <circle id="timer-circle" cx="45" cy="45" r="38" fill="none"
          stroke="#4CC9F0" stroke-width="9"
          stroke-dasharray="238.76" stroke-dashoffset="0"
          stroke-linecap="round"/>
      </svg>
      <div class="timer-num" id="timer-num">20</div>
    </div>
    <div class="resp-label" style="font-family:'Fredoka One',cursive;font-size:1rem;color:var(--muted)">
      <span id="resp-count">0</span>/<span id="resp-total">0</span> 📩
    </div>
  </div>

  <div class="q-card">
    <div class="q-text" id="q-text">Memuat soal...</div>
  </div>

  <div class="ans-grid" id="ans-grid">
    <button class="ans-btn c1" onclick="hostReveal()"><div class="ans-icon">▲</div><span id="ans-a">–</span></button>
    <button class="ans-btn c2" onclick="hostReveal()"><div class="ans-icon">◆</div><span id="ans-b">–</span></button>
    <button class="ans-btn c3" onclick="hostReveal()"><div class="ans-icon">●</div><span id="ans-c">–</span></button>
    <button class="ans-btn c4" onclick="hostReveal()"><div class="ans-icon">■</div><span id="ans-d">–</span></button>
  </div>

  <div class="resp-pill">
    <span style="color:var(--muted);font-size:0.9rem;font-weight:700">Sudah jawab:</span>
    <div class="resp-track"><div class="resp-fill" id="resp-fill" style="width:0%"></div></div>
    <div class="resp-label"><span id="resp-c2">0</span>/<span id="resp-t2">0</span></div>
  </div>
</div>

<!-- ══════════ RESULT ══════════ -->
<div id="screen-result" class="screen">
  <div class="result-title">✅ Jawaban Benar!</div>
  <div class="res-grid" id="res-grid"></div>
  <div class="bar-section" id="bar-section"></div>
  <button class="btn-next" id="btn-next" onclick="nextQ()">Soal Berikutnya →</button>
</div>

<!-- ══════════ LEADERBOARD ══════════ -->
<div id="screen-leaderboard" class="screen">
  <div class="confetti-wrap" id="confetti-wrap"></div>
  <div class="lb-title">🏆 Leaderboard!</div>
  <div class="podium" id="podium"></div>
  <div class="lb-list" id="lb-list"></div>
  <button class="btn-again" onclick="location.reload()">🔄 Main Lagi</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ═══════════════ CONFIG (SUDAH DITANAM) ═══════════════ */
const FIREBASE_URL = 'https://kuiskita-52582-default-rtdb.asia-southeast1.firebasedatabase.app';
const API_URL      = 'https://script.google.com/macros/s/AKfycbyNE2kPtPb4e1Hj1w3tKaRXiGXkP_SDsJhbYgDadAKCX2zDtjZX95pbkcdEKsVC49Pd/exec';

/* ═══════════════ STATE ═══════════════ */
let db, roomRef;
let questions=[], currentQ=0, timePerQ=20;
let timerInterval=null, timeLeft=20;
let roomPin='', totalPlayers=0;

const ICONS=['▲','◆','●','■'];
const COLS=['c1','c2','c3','c4'];
const BARCOLS=['#FF4D6D','#4CC9F0','#FFD93D','#06D6A0'];

/* ═══════════════ PARTICLES ═══════════════ */
function spawnParticles(){
  const wrap=document.getElementById('particles');
  const colors=['#FF4D6D','#4CC9F0','#FFD93D','#06D6A0','#A855F7'];
  for(let i=0;i<25;i++){
    const d=document.createElement('div');
    d.className='particle';
    const sz=Math.random()*8+3;
    d.style.cssText=`
      width:${sz}px;height:${sz}px;
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*12+8}s;
      animation-delay:${Math.random()*10}s;
    `;
    wrap.appendChild(d);
  }
}
spawnParticles();

/* ═══════════════ TIME SELECTOR ═══════════════ */
function setTime(t,btn){
  timePerQ=t;
  document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* ═══════════════ SCREEN NAV ═══════════════ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

/* ═══════════════ SETUP ═══════════════ */
async function startSetup(){
  const pin=document.getElementById('room-pin').value.trim();
  const errBox=document.getElementById('setup-error');
  errBox.style.display='none';

  if(pin.length<4){
    errBox.textContent='⚠️ PIN minimal 4 digit ya!';
    errBox.style.display='block';return;
  }
  roomPin=pin;

  // Init Firebase
  try{
    if(!firebase.apps.length) firebase.initializeApp({databaseURL:FIREBASE_URL});
    db=firebase.database();
  }catch(e){
    errBox.textContent='❌ Gagal konek Firebase: '+e.message;
    errBox.style.display='block';return;
  }

  // Fetch soal
  const btn=document.querySelector('.btn-launch');
  btn.textContent='⏳ Memuat soal...';btn.disabled=true;
  try{
    const res=await fetch(API_URL+'?action=getQuestions');
    const data=await res.json();
    if(!data.questions||data.questions.length===0) throw new Error('Soal kosong di spreadsheet.');
    questions=data.questions;
  }catch(e){
    errBox.textContent='❌ Gagal muat soal: '+e.message;
    errBox.style.display='block';
    btn.textContent='🚀 Buat Room & Muat Soal!';btn.disabled=false;return;
  }

  // Buat room
  roomRef=db.ref('rooms/'+roomPin);
  await roomRef.set({
    status:'lobby',pin:roomPin,
    questionCount:questions.length,
    currentQ:-1,timePerQ,
    createdAt:Date.now()
  });

  // Listen players
  roomRef.child('players').on('value',snap=>{
    const pls=snap.val()||{};
    const arr=Object.values(pls);
    totalPlayers=arr.length;
    document.getElementById('player-count').textContent=totalPlayers;
    document.getElementById('resp-total').textContent=totalPlayers;
    document.getElementById('resp-t2').textContent=totalPlayers;
    const grid=document.getElementById('player-grid');
    grid.innerHTML='';
    arr.forEach(p=>{
      const c=document.createElement('div');
      c.className='player-chip';c.textContent='👤 '+(p.name||'?');
      grid.appendChild(c);
    });
  });

  document.getElementById('display-pin').textContent=roomPin;
  showScreen('lobby');
}

/* ═══════════════ GAME ═══════════════ */
async function startGame(){
  if(questions.length===0) return;
  if(totalPlayers===0&&!confirm('Belum ada pemain. Lanjut tetap?')) return;
  currentQ=0;
  await showQuestion(currentQ);
}

async function showQuestion(idx){
  const q=questions[idx];
  showScreen('question');
  document.getElementById('q-num').textContent=idx+1;
  document.getElementById('q-total').textContent=questions.length;
  document.getElementById('q-text').textContent=q.question;
  document.getElementById('ans-a').textContent=q.a||'–';
  document.getElementById('ans-b').textContent=q.b||'–';
  document.getElementById('ans-c').textContent=q.c||'–';
  document.getElementById('ans-d').textContent=q.d||'–';
  document.getElementById('resp-count').textContent='0';
  document.getElementById('resp-c2').textContent='0';
  document.getElementById('resp-fill').style.width='0%';

  await roomRef.update({
    status:'question',currentQ:idx,
    questionText:q.question,
    answers:{a:q.a||'',b:q.b||'',c:q.c||'',d:q.d||''},
    correctAnswer:q.correct,
    timePerQ,questionStartAt:Date.now(),
    responses:null
  });

  roomRef.child('responses').off();
  roomRef.child('responses').on('value',snap=>{
    const r=snap.val()||{};
    const cnt=Object.keys(r).length;
    document.getElementById('resp-count').textContent=cnt;
    document.getElementById('resp-c2').textContent=cnt;
    const pct=totalPlayers>0?(cnt/totalPlayers*100):0;
    document.getElementById('resp-fill').style.width=pct+'%';
  });

  startTimer(timePerQ);
}

function startTimer(sec){
  if(timerInterval) clearInterval(timerInterval);
  timeLeft=sec;
  const circle=document.getElementById('timer-circle');
  const numEl=document.getElementById('timer-num');
  const circ=238.76;
  function tick(){
    numEl.textContent=timeLeft;
    numEl.style.color=timeLeft<=5?'var(--c1)':timeLeft<=10?'var(--c3)':'var(--text)';
    circle.style.strokeDashoffset=circ*(1-timeLeft/sec);
    circle.style.stroke=timeLeft<=5?'var(--c1)':timeLeft<=10?'var(--c3)':'var(--c2)';
    if(timeLeft<=0){clearInterval(timerInterval);hostReveal();}
    timeLeft--;
  }
  tick();timerInterval=setInterval(tick,1000);
}

function hostReveal(){
  if(timerInterval) clearInterval(timerInterval);
  roomRef.update({status:'reveal'});
  const q=questions[currentQ];

  // Result grid
  const grid=document.getElementById('res-grid');grid.innerHTML='';
  ['a','b','c','d'].forEach((k,i)=>{
    if(!q[k]) return;
    const ok=k===q.correct;
    const d=document.createElement('div');
    d.className='res-card '+(ok?'ok':'no');
    d.style.animationDelay=(i*0.1)+'s';
    d.innerHTML=`<span style="font-size:1.6rem">${ok?'✅':'❌'}</span>
      <span style="font-weight:${ok?800:400};font-size:1rem">${q[k]}</span>`;
    grid.appendChild(d);
  });

  // Bar chart
  roomRef.child('responses').once('value').then(snap=>{
    const resp=snap.val()||{};
    const cnt={a:0,b:0,c:0,d:0};
    Object.values(resp).forEach(r=>{if(cnt[r.answer]!==undefined)cnt[r.answer]++});
    const mx=Math.max(...Object.values(cnt),1);
    const bar=document.getElementById('bar-section');bar.innerHTML='';
    ['a','b','c','d'].forEach((k,i)=>{
      if(!q[k]) return;
      const pct=Math.round(cnt[k]/mx*100);
      const row=document.createElement('div');row.className='bar-item';
      row.innerHTML=`<div class="bar-lbl">${ICONS[i]} ${k.toUpperCase()}</div>
        <div class="bar-track2"><div class="bar-fill2" id="bf${k}"
          style="width:0%;background:${BARCOLS[i]};color:${i<2?'#fff':'#0A0A1A'}">${cnt[k]}</div></div>
        <div class="bar-cnt">${cnt[k]}</div>`;
      bar.appendChild(row);
      setTimeout(()=>{document.getElementById('bf'+k).style.width=pct+'%'},80);
    });
    updateScores(resp,q.correct);
  });

  document.getElementById('btn-next').textContent=
    currentQ+1>=questions.length?'🏆 Lihat Leaderboard!':'Soal Berikutnya →';
  showScreen('result');
}

function updateScores(responses,correct){
  const updates={};
  Object.entries(responses).forEach(([uid,r])=>{
    if(r.answer===correct){
      const spd=Math.max(0,timePerQ-r.timeTaken);
      const pts=1000+Math.round(spd*20);
      updates[`rooms/${roomPin}/players/${uid}/score`]=firebase.database.ServerValue.increment(pts);
    }
  });
  if(Object.keys(updates).length>0) db.ref().update(updates);
}

async function nextQ(){
  currentQ++;
  if(currentQ>=questions.length) showLeaderboard();
  else await showQuestion(currentQ);
}

/* ═══════════════ LEADERBOARD ═══════════════ */
function showLeaderboard(){
  roomRef.update({status:'done'});
  roomRef.child('players').once('value').then(snap=>{
    const pls=snap.val()||{};
    const sorted=Object.entries(pls)
      .map(([,p])=>({name:p.name,score:p.score||0}))
      .sort((a,b)=>b.score-a.score);

    // Confetti!
    spawnConfetti();

    // Podium order: 2nd, 1st, 3rd
    const podium=document.getElementById('podium');podium.innerHTML='';
    const ORDER=[1,0,2],PCLS=['p2','p1','p3'],MEDALS=['🥈','🥇','🥉'];
    ORDER.forEach((rank,pos)=>{
      const p=sorted[rank];if(!p) return;
      const div=document.createElement('div');
      div.className='pod-item '+PCLS[pos];
      div.innerHTML=`
        <div class="pod-avatar">${MEDALS[pos]}</div>
        <div class="pod-name">${p.name}</div>
        <div class="pod-pts">${p.score.toLocaleString()} pts</div>
        <div class="pod-block">${rank+1}</div>`;
      podium.appendChild(div);
    });

    // List
    const list=document.getElementById('lb-list');list.innerHTML='';
    sorted.slice(0,10).forEach((p,i)=>{
      const row=document.createElement('div');row.className='lb-row';
      row.style.animationDelay=(i*0.07)+'s';
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      row.innerHTML=`<div class="lb-rank">${medal||('#'+(i+1))}</div>
        <div class="lb-name">${p.name}</div>
        <div class="lb-score">${p.score.toLocaleString()}</div>`;
      list.appendChild(row);
    });
  });
  showScreen('leaderboard');
}

function spawnConfetti(){
  const wrap=document.getElementById('confetti-wrap');
  const colors=['#FF4D6D','#4CC9F0','#FFD93D','#06D6A0','#A855F7','#FF8C42'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');c.className='conf';
    const sz=Math.random()*12+5;
    const isRect=Math.random()>0.5;
    c.style.cssText=`
      width:${sz}px;height:${isRect?sz*0.4:sz}px;
      left:${Math.random()*100}%;top:-20px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${isRect?'2px':'50%'};
      animation-duration:${Math.random()*3+2}s;
      animation-delay:${Math.random()*2}s;
    `;
    wrap.appendChild(c);
  }
}
</script>
</body>
</html>
