<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuisKita – Pemain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --c1:#FF4D6D; --c2:#4CC9F0; --c3:#F8B400; --c4:#06D6A0;
    --dark:#0D0D1A; --card:#16162A; --border:#2A2A4A;
    --text:#F0F0FF; --muted:#7878AA;
    --radius:16px;
  }

  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:'DM Sans',sans-serif;
    background:var(--dark);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
  }

  h1,h2,h3 { font-family:'Syne',sans-serif; }

  .container {
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.5rem;
    text-align:center;
  }

  .screen { display:none; flex-direction:column; align-items:center; gap:1.25rem; width:100%; }
  .screen.active { display:flex; }

  .logo {
    font-family:'Syne',sans-serif;
    font-size:2.5rem;
    font-weight:800;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:2rem;
    width:100%;
  }

  .form-group { margin-bottom:1rem; text-align:left; }
  .form-group label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:0.4rem; }

  input[type="text"] {
    width:100%;
    background:var(--dark);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-family:'DM Sans',sans-serif;
    font-size:1rem;
    padding:0.75rem 1rem;
    outline:none;
    transition:border-color 0.2s;
  }
  input[type="text"]:focus { border-color:var(--c2); }

  .pin-input {
    font-family:'Syne',sans-serif;
    font-size:2.5rem;
    font-weight:800;
    text-align:center;
    letter-spacing:10px;
  }

  .btn {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    padding:0.9rem 2rem;
    border-radius:50px;
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    border:none;
    width:100%;
    transition:transform 0.15s;
  }
  .btn:hover { transform:scale(1.02); }
  .btn:active { transform:scale(0.97); }
  .btn-primary { background:var(--c1); color:#fff; }
  .btn-secondary { background:transparent; border:1px solid var(--border); color:var(--text); }

  /* ── JOIN ── */
  .firebase-row { margin-bottom:1.25rem; }

  /* ── LOBBY ── */
  .waiting-anim {
    width:120px; height:120px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(76,201,240,0.15), transparent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:4rem;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform:scale(1); opacity:0.9; }
    50% { transform:scale(1.1); opacity:1; }
  }

  .my-name {
    font-family:'Syne',sans-serif;
    font-size:1.5rem;
    font-weight:700;
    color:var(--c2);
  }

  .status-text { color:var(--muted); font-size:0.95rem; }

  /* ── ANSWER BUTTONS ── */
  .q-display {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:1.5rem;
    font-family:'Syne',sans-serif;
    font-size:1.2rem;
    font-weight:700;
    line-height:1.4;
    width:100%;
    text-align:center;
  }

  .timer-bar {
    width:100%;
    height:10px;
    background:var(--border);
    border-radius:50px;
    overflow:hidden;
  }
  .timer-fill {
    height:100%;
    border-radius:50px;
    background:var(--c2);
    transition:width 1s linear, background 0.5s;
  }

  .answer-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0.75rem;
    width:100%;
  }

  .ans-btn {
    padding:1.25rem 0.75rem;
    border-radius:var(--radius);
    font-family:'Syne',sans-serif;
    font-size:1rem;
    font-weight:700;
    border:none;
    cursor:pointer;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.5rem;
    transition:transform 0.15s, opacity 0.3s;
    min-height:90px;
  }
  .ans-btn:hover { transform:scale(1.03); }
  .ans-btn:active { transform:scale(0.95); }
  .ans-btn.a { background:var(--c1); }
  .ans-btn.b { background:var(--c2); color:var(--dark); }
  .ans-btn.c { background:var(--c3); color:var(--dark); }
  .ans-btn.d { background:var(--c4); color:var(--dark); }
  .ans-btn:disabled { opacity:0.5; cursor:default; transform:none; }
  .ans-btn.selected { outline:4px solid #fff; }

  .ans-shape { font-size:1.5rem; }
  .ans-label { font-size:0.8rem; font-weight:500; }

  /* ── RESULT ── */
  .result-big {
    font-size:5rem;
    animation:bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes bounceIn {
    from { transform:scale(0); opacity:0; }
    to   { transform:scale(1); opacity:1; }
  }

  .result-label {
    font-family:'Syne',sans-serif;
    font-size:1.5rem;
    font-weight:700;
  }

  .score-box {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:1rem 2rem;
    text-align:center;
    width:100%;
  }
  .score-pts {
    font-family:'Syne',sans-serif;
    font-size:2rem;
    font-weight:800;
    color:var(--c4);
  }
  .score-lbl { color:var(--muted); font-size:0.85rem; }

  /* ── DONE ── */
  .done-icon { font-size:5rem; }

  /* ── ERROR ── */
  .error-box {
    background:rgba(255,77,109,0.1);
    border:1px solid var(--c1);
    border-radius:12px;
    padding:1rem;
    color:var(--c1);
    font-size:0.9rem;
    width:100%;
  }

  .dot { display:inline-block; width:8px;height:8px;border-radius:50%;background:var(--c2);animation:blink 1.2s infinite;margin:0 2px; }
  .dot:nth-child(2){animation-delay:0.2s}.dot:nth-child(3){animation-delay:0.4s}
  @keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}
</style>
</head>
<body>
<div class="container">

  <!-- JOIN -->
  <div id="screen-join" class="screen active">
    <div class="logo">KuisKita</div>
    <p style="color:var(--muted)">Masukkan PIN room dan nama kamu</p>

    <div id="join-error" class="error-box" style="display:none"></div>

    <div class="card">
      <div class="form-group firebase-row">
        <label>🔑 Firebase URL (sama seperti host)</label>
        <input type="text" id="fb-url" placeholder="https://xxx-default-rtdb.firebaseio.com" />
      </div>
      <div class="form-group">
        <label>🔢 PIN Room</label>
        <input type="text" class="pin-input" id="pin-input" maxlength="6" placeholder="• • • • • •" inputmode="numeric" />
      </div>
      <div class="form-group">
        <label>👤 Nama Kamu</label>
        <input type="text" id="name-input" placeholder="Masukkan nama..." maxlength="20" />
      </div>
      <button class="btn btn-primary" onclick="joinRoom()">Masuk Room →</button>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen">
    <div class="waiting-anim">🎮</div>
    <div class="my-name" id="my-name-display">Nama</div>
    <div class="status-text">Berhasil bergabung! Menunggu host memulai...</div>
    <div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <!-- QUESTION -->
  <div id="screen-question" class="screen">
    <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
    <div class="q-display" id="q-text">Memuat soal...</div>
    <div class="answer-grid" id="answer-grid">
      <button class="ans-btn a" id="btn-a" onclick="submitAnswer('a')">
        <span class="ans-shape">▲</span><span id="label-a" class="ans-label">–</span>
      </button>
      <button class="ans-btn b" id="btn-b" onclick="submitAnswer('b')">
        <span class="ans-shape">◆</span><span id="label-b" class="ans-label">–</span>
      </button>
      <button class="ans-btn c" id="btn-c" onclick="submitAnswer('c')">
        <span class="ans-shape">●</span><span id="label-c" class="ans-label">–</span>
      </button>
      <button class="ans-btn d" id="btn-d" onclick="submitAnswer('d')">
        <span class="ans-shape">■</span><span id="label-d" class="ans-label">–</span>
      </button>
    </div>
  </div>

  <!-- ANSWERED -->
  <div id="screen-answered" class="screen">
    <div style="font-size:5rem">⏳</div>
    <div style="font-family:Syne,sans-serif;font-size:1.25rem">Jawaban dikirim!</div>
    <div style="color:var(--muted)">Menunggu waktu habis...</div>
    <div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="result-big" id="result-emoji">✅</div>
    <div class="result-label" id="result-label">Benar!</div>
    <div class="score-box">
      <div class="score-lbl">+poin</div>
      <div class="score-pts" id="pts-gained">+0</div>
      <div class="score-lbl">Total Skor</div>
      <div class="score-pts" id="total-score">0</div>
    </div>
    <div style="color:var(--muted);font-size:0.9rem">Tunggu soal berikutnya...</div>
  </div>

  <!-- DONE -->
  <div id="screen-done" class="screen">
    <div class="done-icon">🏆</div>
    <h2>Game Selesai!</h2>
    <div class="score-box">
      <div class="score-lbl">Skor Akhir Kamu</div>
      <div class="score-pts" id="final-score">0</div>
    </div>
    <div style="color:var(--muted);font-size:0.9rem">Lihat leaderboard di layar host!</div>
    <button class="btn btn-secondary" onclick="location.reload()">Main Lagi</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ─── STATE ─── */
let db, roomRef, playerRef;
let myUID    = 'p_' + Math.random().toString(36).slice(2, 9);
let myName   = '';
let myScore  = 0;
let currentQIdx = -1;
let hasAnswered = false;
let qStartTime  = 0;
let timePerQ    = 20;
let timerInterval = null;

/* ─── NAV ─── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

/* ─── JOIN ─── */
async function joinRoom() {
  const fbUrl = document.getElementById('fb-url').value.trim();
  const pin   = document.getElementById('pin-input').value.trim();
  const name  = document.getElementById('name-input').value.trim();
  const errBox = document.getElementById('join-error');
  errBox.style.display = 'none';

  if (!fbUrl) { errBox.textContent = '⚠️ Isi Firebase URL.'; errBox.style.display='block'; return; }
  if (!pin)   { errBox.textContent = '⚠️ Masukkan PIN room.'; errBox.style.display='block'; return; }
  if (!name)  { errBox.textContent = '⚠️ Masukkan nama kamu.'; errBox.style.display='block'; return; }

  myName = name;

  try {
    if (!firebase.apps.length) firebase.initializeApp({ databaseURL: fbUrl });
    db = firebase.database();
  } catch(e) {
    errBox.textContent = '❌ Firebase URL tidak valid.'; errBox.style.display='block'; return;
  }

  // Check room exists
  const snap = await db.ref('rooms/' + pin).once('value');
  if (!snap.exists()) {
    errBox.textContent = '❌ Room dengan PIN ' + pin + ' tidak ditemukan.';
    errBox.style.display = 'block'; return;
  }

  const room = snap.val();
  if (room.status === 'done') {
    errBox.textContent = '⚠️ Game sudah selesai.'; errBox.style.display='block'; return;
  }

  roomRef  = db.ref('rooms/' + pin);
  playerRef = roomRef.child('players/' + myUID);

  await playerRef.set({ name: myName, score: 0 });
  playerRef.onDisconnect().remove();

  document.getElementById('my-name-display').textContent = myName;
  showScreen('lobby');

  timePerQ = room.timePerQ || 20;

  // Listen for game state
  roomRef.on('value', snap => {
    const room = snap.val();
    if (!room) return;

    if (room.status === 'question' && room.currentQ !== currentQIdx) {
      currentQIdx = room.currentQ;
      hasAnswered = false;
      qStartTime  = room.questionStartAt || Date.now();
      timePerQ    = room.timePerQ || 20;
      showQuestion(room);
    } else if (room.status === 'reveal' && !hasAnswered) {
      // Time's up, no answer
      showResult(false, 0);
    } else if (room.status === 'done') {
      showDone();
    }
  });
}

/* ─── QUESTION ─── */
function showQuestion(room) {
  const ans = room.answers || {};
  document.getElementById('q-text').textContent = room.questionText || '...';
  document.getElementById('label-a').textContent = ans.a || '–';
  document.getElementById('label-b').textContent = ans.b || '–';
  document.getElementById('label-c').textContent = ans.c || '–';
  document.getElementById('label-d').textContent = ans.d || '–';

  ['a','b','c','d'].forEach(k => {
    const btn = document.getElementById('btn-' + k);
    btn.disabled = false;
    btn.classList.remove('selected');
    if (!ans[k]) btn.style.opacity = '0.3';
    else btn.style.opacity = '1';
  });

  startTimer(timePerQ, qStartTime);
  showScreen('question');
}

function startTimer(sec, startAt) {
  if (timerInterval) clearInterval(timerInterval);
  const fill = document.getElementById('timer-fill');

  function tick() {
    const elapsed = (Date.now() - startAt) / 1000;
    const pct = Math.max(0, 1 - elapsed / sec) * 100;
    fill.style.width = pct + '%';
    fill.style.background = pct < 30 ? 'var(--c1)' : pct < 60 ? 'var(--c3)' : 'var(--c2)';
    if (pct <= 0) clearInterval(timerInterval);
  }
  tick();
  timerInterval = setInterval(tick, 500);
}

/* ─── ANSWER ─── */
async function submitAnswer(key) {
  if (hasAnswered) return;
  hasAnswered = true;

  const timeTaken = (Date.now() - qStartTime) / 1000;

  ['a','b','c','d'].forEach(k => {
    const btn = document.getElementById('btn-' + k);
    btn.disabled = true;
    if (k === key) btn.classList.add('selected');
  });

  await roomRef.child('responses/' + myUID).set({
    answer: key,
    timeTaken: timeTaken,
    name: myName
  });

  showScreen('answered');

  // Wait for reveal
  roomRef.child('status').on('value', snap => {
    if (snap.val() === 'reveal') {
      roomRef.child('correctAnswer').once('value').then(cs => {
        const correct = cs.val();
        const isCorrect = key === correct;
        let pts = 0;
        if (isCorrect) {
          const speed = Math.max(0, timePerQ - timeTaken);
          pts = 1000 + Math.round(speed * 20);
          myScore += pts;
        }
        roomRef.child('status').off();
        showResult(isCorrect, pts);
      });
    }
  });
}

function showResult(isCorrect, pts) {
  document.getElementById('result-emoji').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('result-label').textContent = isCorrect ? 'Benar! Keren!' : 'Salah...';
  document.getElementById('pts-gained').textContent = '+' + pts.toLocaleString();
  document.getElementById('total-score').textContent = myScore.toLocaleString();
  showScreen('result');
}

function showDone() {
  document.getElementById('final-score').textContent = myScore.toLocaleString();
  showScreen('done');
}
</script>
</body>
</html>
