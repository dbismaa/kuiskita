<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuisKita – Pemain</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
:root{
  --c1:#FF4D6D;--c2:#4CC9F0;--c3:#FFD93D;--c4:#06D6A0;--c5:#A855F7;
  --dark:#0A0A1A;--card:#13132A;--border:#252545;
  --text:#F5F5FF;--muted:#7070AA;--radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif;
  background:var(--dark);color:var(--text);
  min-height:100vh;display:flex;
  align-items:center;justify-content:center;
  padding:1.5rem;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 30% 30%,rgba(168,85,247,0.07) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 70%,rgba(76,201,240,0.07) 0%,transparent 60%);
  pointer-events:none;
}
h1,h2,.logo-text{font-family:'Fredoka One',cursive}

.container{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:1.25rem;position:relative;z-index:1}

.screen{display:none;flex-direction:column;align-items:center;gap:1.1rem;width:100%;text-align:center}
.screen.active{display:flex}

.logo-text{
  font-size:2.8rem;
  background:linear-gradient(135deg,var(--c1),var(--c3),var(--c2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,77,109,0.3));
}

/* ── JOIN ── */
.join-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.75rem;width:100%;
  animation:slideUp 0.5s ease;
  box-shadow:0 15px 50px rgba(0,0,0,0.4);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bounceIn{from{transform:scale(0.5) translateY(-30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes popIn{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1.2)}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}

.flabel{font-size:0.8rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:0.4rem;text-align:left}

.finput{
  width:100%;background:var(--dark);
  border:2px solid var(--border);border-radius:14px;
  color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;
  padding:0.75rem 1rem;outline:none;
  transition:border-color 0.3s,box-shadow 0.3s;margin-bottom:1rem;
}
.finput:focus{border-color:var(--c2);box-shadow:0 0 0 3px rgba(76,201,240,0.15)}

.pin-finput{
  font-family:'Fredoka One',cursive;font-size:2.8rem;
  letter-spacing:10px;text-align:center;
}

.name-finput{font-size:1.1rem;font-weight:700}

.btn-join{
  width:100%;padding:1rem;
  background:linear-gradient(135deg,var(--c1),var(--c5));
  border:none;border-radius:50px;
  font-family:'Fredoka One',cursive;font-size:1.2rem;color:#fff;
  cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 8px 25px rgba(255,77,109,0.4);
  margin-top:0.25rem;
}
.btn-join:hover{transform:scale(1.03) translateY(-2px)}
.btn-join:active{transform:scale(0.97)}

.error-box{
  background:rgba(255,77,109,0.1);border:1px solid var(--c1);
  border-radius:12px;padding:0.75rem 1rem;color:var(--c1);
  font-size:0.9rem;width:100%;animation:shake 0.4s ease;display:none;
}

/* ── LOBBY ── */
.lobby-anim{
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,201,240,0.12),transparent);
  display:flex;align-items:center;justify-content:center;
  font-size:4.5rem;animation:pulse 2s ease-in-out infinite;
}
.my-name-big{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--c2)}
.lobby-status{color:var(--muted);font-weight:600}

.dots{display:flex;gap:6px;align-items:center;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c2);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:0.2s;background:var(--c3)}
.dot:nth-child(3){animation-delay:0.4s;background:var(--c4)}

/* ── QUESTION ── */
.timer-bar{width:100%;height:12px;background:var(--border);border-radius:50px;overflow:hidden}
.timer-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--c4),var(--c2));transition:width 0.5s linear,background 0.5s}

.q-num-badge{
  font-family:'Fredoka One',cursive;font-size:0.95rem;
  background:var(--card);border:1px solid var(--border);
  border-radius:50px;padding:0.4rem 1rem;color:var(--c2);
  align-self:flex-start;
}

.q-card-p{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.5rem;width:100%;
  font-family:'Fredoka One',cursive;font-size:1.25rem;line-height:1.4;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  animation:slideUp 0.4s ease;
}

.ans-grid-p{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;width:100%}
.ans-p{
  padding:1.1rem 0.6rem;border-radius:16px;
  font-family:'Fredoka One',cursive;font-size:0.95rem;
  border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:0.4rem;
  transition:transform 0.15s,box-shadow 0.2s;
  min-height:85px;animation:popIn 0.4s ease both;
  position:relative;overflow:hidden;
}
.ans-p::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background 0.2s}
.ans-p:hover::after{background:rgba(255,255,255,0.12)}
.ans-p:hover{transform:scale(1.04) translateY(-2px)}
.ans-p:active{transform:scale(0.95)}
.ans-p:nth-child(1){animation-delay:0.05s}
.ans-p:nth-child(2){animation-delay:0.1s}
.ans-p:nth-child(3){animation-delay:0.15s}
.ans-p:nth-child(4){animation-delay:0.2s}
.ans-p.c1{background:linear-gradient(135deg,#FF4D6D,#FF2D50);color:#fff;box-shadow:0 5px 18px rgba(255,77,109,0.4)}
.ans-p.c2{background:linear-gradient(135deg,#4CC9F0,#2AAEDD);color:var(--dark);box-shadow:0 5px 18px rgba(76,201,240,0.4)}
.ans-p.c3{background:linear-gradient(135deg,#FFD93D,#FFC107);color:var(--dark);box-shadow:0 5px 18px rgba(255,217,61,0.4)}
.ans-p.c4{background:linear-gradient(135deg,#06D6A0,#00B887);color:var(--dark);box-shadow:0 5px 18px rgba(6,214,160,0.4)}
.ans-p:disabled{opacity:0.45;cursor:default;transform:none!important;box-shadow:none!important}
.ans-p.selected{outline:4px solid rgba(255,255,255,0.8);transform:scale(1.06)!important}
.ans-icon-p{font-size:1.4rem}
.ans-lbl-p{font-size:0.8rem;opacity:0.9;padding:0 4px;line-height:1.2}

/* ── ANSWERED ── */
.answered-icon{font-size:5rem;animation:bounceIn 0.5s ease}
.answered-txt{font-family:'Fredoka One',cursive;font-size:1.5rem}

/* ── RESULT ── */
.result-emoji{font-size:5.5rem;animation:bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
.result-lbl{font-family:'Fredoka One',cursive;font-size:1.8rem}

.score-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.2rem 2rem;width:100%;
  animation:popIn 0.4s ease 0.2s both;
}
.score-pts{font-family:'Fredoka One',cursive;font-size:2.2rem;color:var(--c4)}
.score-lbl{color:var(--muted);font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}

/* ── LEADERBOARD (PEMAIN) ── */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:100}
.conf{position:absolute;animation:confettiFall linear forwards}

.lb-title-p{font-family:'Fredoka One',cursive;font-size:2.5rem;animation:bounceIn 0.7s ease}
.final-score-big{
  font-family:'Fredoka One',cursive;font-size:3.5rem;
  color:var(--c3);filter:drop-shadow(0 0 20px rgba(255,217,61,0.4));
  animation:bounceIn 0.6s ease 0.3s both;
}
.my-rank-badge{
  font-family:'Fredoka One',cursive;font-size:1rem;
  background:var(--card);border:1px solid var(--border);
  border-radius:50px;padding:0.5rem 1.5rem;color:var(--muted);
  animation:popIn 0.4s ease 0.5s both;
}
.my-rank-badge span{color:var(--c2)}

.lb-list-p{width:100%;display:flex;flex-direction:column;gap:0.5rem}
.lb-row-p{
  display:flex;align-items:center;gap:0.9rem;
  padding:0.8rem 1rem;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  animation:slideIn 0.4s ease both;
  transition:transform 0.2s;
}
.lb-row-p.me{border-color:var(--c2);background:rgba(76,201,240,0.08);transform:scale(1.02)}
.lb-rank-p{font-family:'Fredoka One',cursive;font-size:1.1rem;width:28px;color:var(--muted)}
.lb-name-p{flex:1;font-weight:700;font-size:0.95rem;text-align:left}
.lb-score-p{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--c4)}

.btn-again{
  padding:0.85rem 2rem;margin-top:0.5rem;
  background:transparent;border:2px solid var(--border);
  border-radius:50px;font-family:'Fredoka One',cursive;
  font-size:1.1rem;color:var(--text);cursor:pointer;transition:all 0.2s;
}
.btn-again:hover{border-color:var(--c1);color:var(--c1)}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:0.5}90%{opacity:0.2}100%{transform:translateY(-10vh) scale(1);opacity:0}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="container">

  <!-- JOIN -->
  <div id="screen-join" class="screen active">
    <div style="animation:bounceIn 0.7s ease">
      <div style="font-size:2.5rem;animation:wiggle 2s infinite">🎮</div>
      <div class="logo-text">KuisKita</div>
      <div style="color:var(--muted);font-size:0.95rem;font-weight:600">Masukkan PIN & nama kamu!</div>
    </div>

    <div id="join-error" class="error-box"></div>

    <div class="join-card">
      <label class="flabel">🔢 PIN Room</label>
      <input class="finput pin-finput" type="text" id="pin-in"
        maxlength="6" placeholder="••••••" inputmode="numeric"
        oninput="this.value=this.value.replace(/\D/g,'')" />

      <label class="flabel">👤 Nama Kamu</label>
      <input class="finput name-finput" type="text" id="name-in"
        placeholder="Masukkan nama..." maxlength="20" />

      <button class="btn-join" onclick="joinRoom()">Masuk Room! 🚀</button>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-anim">🎮</div>
    <div class="my-name-big" id="my-name-disp">Nama</div>
    <div class="lobby-status">Berhasil bergabung! Tunggu host mulai ya~</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <!-- QUESTION -->
  <div id="screen-question" class="screen">
    <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
    <div class="q-num-badge">Soal <span id="qp-num">1</span> / <span id="qp-total">?</span></div>
    <div class="q-card-p" id="qp-text">Memuat soal...</div>
    <div class="ans-grid-p">
      <button class="ans-p c1" id="btn-a" onclick="submitAnswer('a')">
        <span class="ans-icon-p">▲</span><span class="ans-lbl-p" id="lbl-a">–</span>
      </button>
      <button class="ans-p c2" id="btn-b" onclick="submitAnswer('b')">
        <span class="ans-icon-p">◆</span><span class="ans-lbl-p" id="lbl-b">–</span>
      </button>
      <button class="ans-p c3" id="btn-c" onclick="submitAnswer('c')">
        <span class="ans-icon-p">●</span><span class="ans-lbl-p" id="lbl-c">–</span>
      </button>
      <button class="ans-p c4" id="btn-d" onclick="submitAnswer('d')">
        <span class="ans-icon-p">■</span><span class="ans-lbl-p" id="lbl-d">–</span>
      </button>
    </div>
  </div>

  <!-- ANSWERED -->
  <div id="screen-answered" class="screen">
    <div class="answered-icon">⏳</div>
    <div class="answered-txt">Jawaban terkirim!</div>
    <div style="color:var(--muted);font-weight:600">Sabar ya, tunggu yang lain...</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="result-emoji" id="res-emoji">✅</div>
    <div class="result-lbl" id="res-lbl">Benar!</div>
    <div class="score-card">
      <div class="score-lbl">Poin didapat</div>
      <div class="score-pts" id="pts-got">+0</div>
      <div style="height:1px;background:var(--border);margin:0.75rem 0"></div>
      <div class="score-lbl">Total Skor</div>
      <div class="score-pts" id="total-pts">0</div>
    </div>
    <div style="color:var(--muted);font-size:0.9rem;font-weight:600">Tunggu soal berikutnya... 🔥</div>
  </div>

  <!-- LEADERBOARD PEMAIN -->
  <div id="screen-done" class="screen">
    <div class="confetti-wrap" id="conf-wrap"></div>
    <div class="lb-title-p">🏆 Game Selesai!</div>
    <div class="score-lbl" style="color:var(--muted)">Skor akhir kamu</div>
    <div class="final-score-big" id="final-pts">0</div>
    <div class="my-rank-badge">Peringkat kamu: <span id="my-rank">#?</span></div>

    <div class="lb-list-p" id="lb-list-p"></div>
    <button class="btn-again" onclick="location.reload()">🔄 Main Lagi</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ═══════ CONFIG SUDAH DITANAM ═══════ */
const FIREBASE_URL='https://kuiskita-52582-default-rtdb.asia-southeast1.firebasedatabase.app';

/* ═══════ STATE ═══════ */
let db,roomRef,playerRef;
let myUID='p_'+Math.random().toString(36).slice(2,9);
let myName='',myScore=0,currentQIdx=-1;
let hasAnswered=false,qStartTime=0,timePerQ=20;
let timerInterval=null,myAnswer='';

/* ═══════ PARTICLES ═══════ */
(function spawnP(){
  const w=document.getElementById('particles');
  const cols=['#FF4D6D','#4CC9F0','#FFD93D','#06D6A0','#A855F7'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');d.className='particle';
    const s=Math.random()*6+2;
    d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${Math.random()*10+8}s;animation-delay:${Math.random()*8}s;`;
    w.appendChild(d);
  }
})();

/* ═══════ NAV ═══════ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

/* ═══════ JOIN ═══════ */
async function joinRoom(){
  const pin=document.getElementById('pin-in').value.trim();
  const name=document.getElementById('name-in').value.trim();
  const err=document.getElementById('join-error');
  err.style.display='none';

  if(!pin){err.textContent='⚠️ Masukkan PIN room dulu!';err.style.display='block';return;}
  if(!name){err.textContent='⚠️ Nama kamu belum diisi!';err.style.display='block';return;}
  myName=name;

  try{
    if(!firebase.apps.length) firebase.initializeApp({databaseURL:FIREBASE_URL});
    db=firebase.database();
  }catch(e){err.textContent='❌ Gagal konek.';err.style.display='block';return;}

  const snap=await db.ref('rooms/'+pin).once('value');
  if(!snap.exists()){
    err.textContent='❌ Room PIN '+pin+' tidak ditemukan!';err.style.display='block';return;
  }
  const room=snap.val();
  if(room.status==='done'){err.textContent='⚠️ Game sudah selesai.';err.style.display='block';return;}

  roomRef=db.ref('rooms/'+pin);
  playerRef=roomRef.child('players/'+myUID);
  await playerRef.set({name:myName,score:0});
  playerRef.onDisconnect().remove();
  timePerQ=room.timePerQ||20;

  document.getElementById('my-name-disp').textContent=myName;
  showScreen('lobby');

  /* listen state */
  roomRef.on('value',snap=>{
    const r=snap.val();if(!r) return;
    if(r.status==='question'&&r.currentQ!==currentQIdx){
      currentQIdx=r.currentQ;hasAnswered=false;myAnswer='';
      qStartTime=r.questionStartAt||Date.now();
      timePerQ=r.timePerQ||20;
      showQuestion(r);
    } else if(r.status==='reveal'){
      if(!hasAnswered) showResult(false,0);
    } else if(r.status==='done'){
      showDone(r);
    }
  });
}

/* ═══════ QUESTION ═══════ */
function showQuestion(room){
  const ans=room.answers||{};
  document.getElementById('qp-num').textContent=(currentQIdx+1);
  document.getElementById('qp-total').textContent=room.questionCount||'?';
  document.getElementById('qp-text').textContent=room.questionText||'...';
  ['a','b','c','d'].forEach(k=>{
    document.getElementById('lbl-'+k).textContent=ans[k]||'–';
    const btn=document.getElementById('btn-'+k);
    btn.disabled=false;btn.classList.remove('selected');
    btn.style.opacity=ans[k]?'1':'0.3';
  });
  startTimer(timePerQ,qStartTime);
  showScreen('question');
}

function startTimer(sec,startAt){
  if(timerInterval) clearInterval(timerInterval);
  const fill=document.getElementById('timer-fill');
  function tick(){
    const el=(Date.now()-startAt)/1000;
    const pct=Math.max(0,(1-el/sec)*100);
    fill.style.width=pct+'%';
    fill.style.background=pct<25?'linear-gradient(90deg,var(--c1),#FF2D50)':pct<55?'linear-gradient(90deg,var(--c3),var(--c1))':'linear-gradient(90deg,var(--c4),var(--c2))';
    if(pct<=0) clearInterval(timerInterval);
  }
  tick();timerInterval=setInterval(tick,400);
}

/* ═══════ SUBMIT ═══════ */
async function submitAnswer(key){
  if(hasAnswered) return;
  hasAnswered=true;myAnswer=key;
  const timeTaken=(Date.now()-qStartTime)/1000;
  ['a','b','c','d'].forEach(k=>{
    const b=document.getElementById('btn-'+k);
    b.disabled=true;
    if(k===key) b.classList.add('selected');
  });
  await roomRef.child('responses/'+myUID).set({answer:key,timeTaken,name:myName});
  showScreen('answered');

  roomRef.child('status').on('value',snap=>{
    if(snap.val()==='reveal'){
      roomRef.child('correctAnswer').once('value').then(cs=>{
        const correct=cs.val();
        const ok=key===correct;
        let pts=0;
        if(ok){const spd=Math.max(0,timePerQ-timeTaken);pts=1000+Math.round(spd*20);myScore+=pts;}
        roomRef.child('status').off();
        showResult(ok,pts);
      });
    }
  });
}

function showResult(ok,pts){
  document.getElementById('res-emoji').textContent=ok?'✅':'❌';
  document.getElementById('res-lbl').textContent=ok?'Yeay, Benar! 🎉':'Salah nih... 😅';
  document.getElementById('pts-got').textContent='+'+(pts.toLocaleString());
  document.getElementById('total-pts').textContent=myScore.toLocaleString();
  showScreen('result');
}

/* ═══════ DONE / LEADERBOARD ═══════ */
function showDone(roomData){
  document.getElementById('final-pts').textContent=myScore.toLocaleString();
  spawnConfetti();

  // Ambil semua skor dari Firebase untuk leaderboard pemain
  roomRef.child('players').once('value').then(snap=>{
    const pls=snap.val()||{};
    const sorted=Object.entries(pls)
      .map(([uid,p])=>({uid,name:p.name,score:p.score||0}))
      .sort((a,b)=>b.score-a.score);

    const myRank=sorted.findIndex(p=>p.uid===myUID)+1;
    document.getElementById('my-rank').textContent='#'+myRank;

    const list=document.getElementById('lb-list-p');list.innerHTML='';
    sorted.slice(0,10).forEach((p,i)=>{
      const row=document.createElement('div');
      row.className='lb-row-p'+(p.uid===myUID?' me':'');
      row.style.animationDelay=(i*0.07)+'s';
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      row.innerHTML=`<div class="lb-rank-p">${medal||('#'+(i+1))}</div>
        <div class="lb-name-p">${p.uid===myUID?'⭐ '+p.name:p.name}</div>
        <div class="lb-score-p">${p.score.toLocaleString()}</div>`;
      list.appendChild(row);
    });
  });
  showScreen('done');
}

function spawnConfetti(){
  const w=document.getElementById('conf-wrap');
  const cols=['#FF4D6D','#4CC9F0','#FFD93D','#06D6A0','#A855F7','#FF8C42'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');c.className='conf';
    const s=Math.random()*10+4;const rect=Math.random()>0.5;
    c.style.cssText=`width:${s}px;height:${rect?s*0.4:s}px;left:${Math.random()*100}%;top:-20px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${rect?'2px':'50%'};animation-duration:${Math.random()*3+2}s;animation-delay:${Math.random()*1.5}s;`;
    w.appendChild(c);
  }
}
</script>
